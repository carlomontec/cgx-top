[workspace]
resolver = "2"
members = [
    "crates/cgx-core",
    "crates/cgx-top",
    "crates/calculix-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Carlo Montecalvo"]
license = "MIT"
repository = "https://github.com/carlomontec/cgx-top"
description = "The terminal companion to CalculiX GraphiX (CGX) - Interactive FEA inspection TUI"

[workspace.dependencies]
# Performance and zero-copy
memmap2 = "0.9"
rayon = "1.10"
byteorder = "1.5"

# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# CLI and utilities
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"

# Math & 3D transformations
glam = "0.29"
