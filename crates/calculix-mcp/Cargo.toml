[package]
name = "calculix-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Model Context Protocol server for CalculiX decks, solver telemetry and results"

[[bin]]
name = "calculix-mcp"
path = "src/main.rs"

[dependencies]
cgx-core = { path = "../cgx-core" }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time", "fs", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
